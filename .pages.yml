media: 
  - name: images
    label: Images
    input: assets
    output: /assets
    rename: safe
    extensions: [png, jpg, webp]
  - name: gallery-images
    label: Gallery Images
    input: gallery
    output: gallery
    rename: safe
    extensions: [png, jpg, webp]


content:
  - name: gallery-pages
    label: Gallery Pages
    type: collection
    path: gallery
    format: yaml-frontmatter
    filename: "{primary}.markdown"
    fields:
      - name: layout
        label: Layout
        type: string
        hidden: true

      - name: title
        label: Title
        type: string
        required: true

      - name: galleryitems
        label: Gallery items
        type: object
        list: true
        fields:
          - name: imageurl
            label: Image
            type: image
            required: true
            options:
              media: gallery-images

          - name: imagealt
            label: Image alt text
            type: string
            required: true

          - name: vertical
            label: Vertical image
            type: boolean

      - name: body
        label: Template
        type: code
        hidden: true